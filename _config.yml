# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve -l -H localhost`. If you change this file, please restart the 
# server process.

# Basic Site Settings
locale                   : "en-US"
site_theme               : "default"
title                    : "Nikolai Rozanov"
title_separator          : "-"
name                     : &name "Nikolai Rozanov"
description              : &description "CS PhD candidate at Imperial College London, supervised by Prof. Lucia Specia, researching LLM agents, reasoning, and evaluation. Previously Co-Founder & CTO of a London-based AI start-up."
url                      : https://nikolairozanov.com # the base hostname & protocol for your site e.g. "https://[your GitHub username].github.io"
baseurl                  : "" # the subpath of your site, e.g. "/blog"
repository               : "ai-nikolai/ai-nikolai.github.io"

# Site Author - The following control what appear as part of the author content on the side bar.
#               If a field is blank the icon and link will not appear, otherwise it will be shown.
#               Additional customization can be done by editing /_includes/author-profile.html
author:
  # Biographic information
  avatar           : "profile_picture_nikolai.jpeg"
  name             : "Nikolai Rozanov"
  pronouns         : # example: "she/her"  
  bio              : "CS PhD Candidate in LLM Agents & Reasoning @ Imperial College London"
  location         : "London, UK"
  employer         : "Imperial College London"
  employer_url     : "https://www.imperial.ac.uk/computing"
  job_title        : "PhD Candidate in Computer Science"
  research_interests:
    - "Large language models"
    - "AI agents"
    - "Reasoning"
    - "Natural language processing"
    - "Machine learning"
  uri              : # URL
  email            : "nikolai.rozanov@gmail.com" 

  # Academic websites
  arxiv            : # URL - Update with the correct link to your profile
  googlescholar    : "https://scholar.google.com/citations?user=fi-feOEAAAAJ"
  impactstory      : # URL
  orcid            : "https://orcid.org/0000-0003-0274-8832"
  semantic         : # URL
  pubmed           : # URL
  researchgate     : # URL
  scopus           : # URL

  # Repositories and software development
  bitbucket        : # Username - Update with your username on the site
  codepen          : # Username
  dribbble         : # Username
  github           : "ai-nikolai"
  kaggle           : # Username  
  stackoverflow    : 4386933/kolyan1

  # Social media
  bluesky          : # #"bsky.app" # Replace this with you Bluesky username
  facebook         : # Username
  flickr           : # Username
  foursquare       : # Username
  goodreads        : # Username
  google_plus      : # Username
  keybase          : # Username
  instagram        : # Username
  lastfm           : # Username
  linkedin         : nikolai-rozanov-ai
  mastodon         : # URL
  medium           : # URL
  pinterest        : # Username
  soundcloud       : # Username
  steam            : # Username
  telegram         : # URL
  tumblr           : # Username
  twitter          : ai_nikolai
  vine             : # Username
  weibo            : # Username
  wikipedia        : # Username
  xing             : # Username
  youtube          : # Username
  zhihu            : # Username
  huggingface      : ai-nikolai
  openreview       : Nikolai_Rozanov1


# Publication Category - The following the list of publication categories and their headings
publication_category:
  books:
    title: 'Books'
  manuscripts:
    title: 'Journal Articles'    
  conferences:
    title: 'Conference Papers'

# Site Settings
teaser                   : "og-card.jpg" # filename of fallback teaser image placed in /images/
breadcrumbs              : false # true, false (default)
words_per_minute         : 160
future                   : true
read_more                : "disabled" # if enabled, adds "Read more" links to excerpts
comments:
  provider               : # false (default), "disqus", "discourse", "facebook", "google-plus", "staticman", "custom"
  disqus:
    shortname            :
  discourse:
    server               : # https://meta.discourse.org/t/embedding-discourse-comments-via-javascript/31963 , e.g.: meta.discourse.org
  facebook:
    appid                :
    num_posts            : # 5 (default)
    colorscheme          : "light"  # "light" (default), "dark"
staticman:
  allowedFields          : ['name', 'email', 'url', 'message']
  branch                 : "gh-pages" # "master", "gh-pages"
  commitMessage          : "New comment."
  filename               : comment-{@timestamp}
  format                 : "yml"
  moderation             : true
  path                   : "_data/comments/{options.slug}"
  requiredFields         : ['name', 'email', 'message']
  transforms:
    email                : "md5"
  generatedFields:
    date:
      type               : "date"
      options:
        format           : "iso8601" # "iso8601" (default), "timestamp-seconds", "timestamp-milliseconds"
atom_feed:
  hide                   : true     # change to true to hide the RSS feed in the footer
  path                   : # blank (default) uses feed.xml


# SEO Related
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :


# Social Sharing
twitter:
  username               : ai_nikolai
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 : "og-card.jpg" # Open Graph/Twitter default site image
og_image_alt             : "Nikolai Rozanov — LLM agents, reasoning, and evaluation"
og_image_width           : 1200
og_image_height          : 630
# For specifying social profiles
# - https://developers.google.com/structured-data/customize/social-profiles
social:
  type                   : Person
  name                   : Nikolai Rozanov
  links:
    - https://scholar.google.com/citations?user=fi-feOEAAAAJ
    - https://github.com/ai-nikolai
    - https://orcid.org/0000-0003-0274-8832
    - https://www.linkedin.com/in/nikolai-rozanov-ai
    - https://twitter.com/ai_nikolai


# Analytics
analytics:
  provider               :  "google-analytics-4" # false (default), "google", "google-universal", "google-analytics-4", "custom"
  google:
    tracking_id          :  "G-N61Q6803EK"
  google-analytics-4:
    tracking_id          :  "G-N61Q6803EK"

# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - archive
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - CONTRIBUTING.md
  - Dockerfile
  - docker-compose.yaml
  - Gemfile
  - Gemfile.lock
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - markdown_generator
  - node_modules
  - package.json*
  - Rakefile
  - README
  - README.md
  - README_local.md
  - scripts
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


